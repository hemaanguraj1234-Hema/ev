<html>
<head>
<title>STC Pollachi - TARANG</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: lavender;
}

#banner {
    background-color: purple;
    color: white;
    text-align: center;
    padding: 20px;
    animation: slide 1s;
}

#banner h2 {
    color: Orange;
}

#details {
    display: flex;
    gap: 30px;
    margin: 30px;
    text-align: center;
}

#event-details {
    border: 3px solid black;
    background-color: lightblue;
    padding: 20px;
    width: 50%;
    border-radius: 10px;
    animation: fade 2s;
}

#registration-events {
    border: 3px solid black;
    background-color: lightpink;
    padding: 20px;
    width: 50%;
    border-radius: 10px;
    animation: fade 2s;
}

h1 {
    text-align: center;
}

h3 {
    color: darkblue;
    transition: transform 0.5s;
}

#event-details h3:hover {
    color: red;
    transform: scale(1.1);
}

button {
    padding: 10px 20px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: block;
    margin: 20px auto;
    animation: pulse 2s infinite;
}

button:hover {
    background-color: darkgreen;
}

@keyframes slide {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes fade {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }

    100% {
        transform: scale(1);
    }
}

@media screen and (max-width: 600px) {
    #details {
        flex-direction: column;
    }

    #event-details,
    #registration-events {
        width: auto;
    }
}
</style>
</head>

<body>

<div id="banner">
    <h1>STC | Pollachi</h1>
    <h2>TARANG</h2>
    <p>It is an inter college meet fest, happening on 09-10-2026</p>
</div>

<div id="details">

    <div id="event-details">
        <h1>Event Details</h1>
        <h3>Quiz</h3>
        <h3>Connection</h3>
        <h3>Dancing</h3>
    </div>

    <div id="registration-events">
        <h1>Registration Details</h1>
        <h3>
            Everyone should register before participating.
            One-time registration allows students to participate
            in many events.
        </h3>
    </div>

</div>

<button>Register Now!</button>

</body>
</html>
